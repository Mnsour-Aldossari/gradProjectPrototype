# Alembic: the database migrations in migrations/versions/. The backend runs them itself at startup (app/db.py), so
# this file is only for running Alembic by hand, from backend/:
#
#     .venv/Scripts/python -m alembic current                                # where the database is
#     .venv/Scripts/python -m alembic revision --autogenerate -m "what"      # a new migration from app/models.py
#
# The database is DATABASE_URL, or backend/uav.db when it is not set (migrations/env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
