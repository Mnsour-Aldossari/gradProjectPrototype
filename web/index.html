<!doctype html>
<html lang="en" data-theme="dark" style="background:#060a14">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a14" />
    <meta name="description" content="UAV landmine survey prototype: mission planning, live monitoring and adaptive classification of potential detections." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UAV Field" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>UAV Landmine Survey</title>
    <script>
      // Apply the display preferences this device used last before the first paint, so a dark page does not
      // flash light while the app loads. The app re-applies the signed-in user's own preferences (src/prefs.ts).
      ;(function () {
        try {
          var p = JSON.parse(localStorage.getItem('uav.prefs.last') || 'null') || {}
          var root = document.documentElement
          // The look is dark only (styles.css); the attribute is still set for code that reads it.
          root.setAttribute('data-theme', 'dark')
          if (p.fontSize === 'small' || p.fontSize === 'large') root.setAttribute('data-font', p.fontSize)
          if (p.density === 'compact') root.setAttribute('data-density', 'compact')
        } catch (e) {
          // storage unavailable: default text size and density
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
